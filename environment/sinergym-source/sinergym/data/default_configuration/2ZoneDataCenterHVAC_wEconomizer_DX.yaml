# Documentation: https://ugr-sail.github.io/sinergym/compilation/main/pages/environments_registration.html
# ---------------------------------------------------------------------------- #
#                        ID BASE FROM ENVIRONMNET NAMES                        #
# ---------------------------------------------------------------------------- #
id_base: datacenter_dx

# ---------------------------------------------------------------------------- #
#                         BUILDING AND WEATHER SETTINGS                        #
# ---------------------------------------------------------------------------- #
building_file: 2ZoneDataCenterHVAC_wEconomizer_DX.epJSON

# A environment alternative for each weather key
weather_specification:
  weather_files:
    - USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw
    - USA_AZ_Davis-Monthan.AFB.722745_TMY3.epw
    - USA_NY_New.York-J.F.Kennedy.Intl.AP.744860_TMY3.epw
    - USA_WA_Port.Angeles-William.R.Fairchild.Intl.AP.727885_TMY3.epw
  keys:
    - chicago
    - hot
    - mixed
    - cool

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
building_config:
  # One control decision and one dataset record every 15 minutes.
  timesteps_per_hour: 4

# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #
# Alternative stochastic environments if it is defined
weather_variability:
  Dry Bulb Temperature:
    - 1.0 # sigma
    - 0.0 # mu
    - 24.0 # tau
  Relative Humidity:
    - [2.0, 5.0]
    - 0.0
    - 24.0
    - [0, 100] # var_range

# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #

# --------------- TIME VARIABLES (same name as EnergyPlus API) --------------- #
time_variables:
  - month
  - day_of_month
  - hour
# More variables in Data Transfer API: https://energyplus.readthedocs.io/en/latest/datatransfer.html

# ----------------------------- OUTPUT:VARIABLES ----------------------------- #
variables:

  # ---------------------------------- OUTDOOR --------------------------------- #
  Site Outdoor Air Drybulb Temperature:
    variable_names: outdoor_temperature
    keys: Environment
  Site Outdoor Air Relative Humidity:
    variable_names: outdoor_humidity
    keys: Environment
  Site Wind Speed:
    variable_names: wind_speed
    keys: Environment
  Site Wind Direction:
    variable_names: wind_direction
    keys: Environment
  Site Diffuse Solar Radiation Rate per Area:
    variable_names: diffuse_solar_radiation
    keys: Environment
  Site Direct Solar Radiation Rate per Area:
    variable_names: direct_solar_radiation
    keys: Environment

  # -------------------------------- ZONE INDOOR ------------------------------- #
  Zone Air Temperature:
    variable_names: air_temperature
    keys:
      - East Zone
      - West Zone
  Zone Mean Radiant Temperature:
    variable_names: mean_radiant_temperature
    keys:
      - East Zone
      - West Zone
  Zone Air Relative Humidity:
    variable_names: air_humidity
    keys:
      - East Zone
      - West Zone

  # ---------------------------------- SYSTEM ---------------------------------- #
  Zone Thermostat Cooling Setpoint Temperature:
    variable_names: clg_setpoint
    keys:
      - East Zone
      - West Zone
  Zone Thermostat Heating Setpoint Temperature:
    variable_names: htg_setpoint
    keys:
      - East Zone
      - West Zone
  System Node Temperature:
    variable_names:
      - east_return_temperature
      - east_supply_temperature
      - west_return_temperature
      - west_supply_temperature
    keys:
      - East Zone Return Air Node
      # Use the same zone-inlet location as its mass-flow observation so
      # m_dot * cp * (T_supply - T_zone) is physically well aligned.
      - East Zone Inlet Node
      - West Zone Return Air Node
      - West Zone Inlet Node
      # - East Zone CCoil Air Outlet Node
      # - West Zone CCoil Air Outlet Node
      # - East Zone Mixed Air Node
      # - West Zone Mixed Air Node
  System Node Mass Flow Rate:
    variable_names: 
      - east_mass_flow_rate
      - west_mass_flow_rate
    keys:
      - East Zone Inlet Node
      - West Zone Inlet Node
      # - East Zone CCoil Air Outlet Node
      # - West Zone CCoil Air Outlet Node
  Cooling Coil Total Cooling Rate:
    variable_names: 
      - east_dx_total_cooling_rate
      - west_dx_total_cooling_rate
    keys:
      - East DX Cooling Coil
      - West DX Cooling Coil
  Cooling Coil Sensible Cooling Rate:
    variable_names: 
      - east_dx_sensible_cooling_rate
      - west_dx_sensible_cooling_rate
    keys:
      - East DX Cooling Coil
      - West DX Cooling Coil
  # ---------------------------------- ENERGY ---------------------------------- #
  # Actual per-zone ITE CPU electrical demand, in W.  Do not use the shared
  # dimensionless CPU-loading fraction as the training power input.
  Zone ITE CPU Electricity Rate:
    variable_names:
      - east_ite_cpu_electricity_rate
      - west_ite_cpu_electricity_rate
    keys:
      - East Zone
      - West Zone
  # Use only the facility-wide HVAC electricity demand in the dataset.  The
  # cooling tower is shared, so per-zone HVAC component sums are intentionally
  # not exposed here.
  Facility Total HVAC Electricity Demand Rate:
    variable_names: HVAC_electricity_demand_rate
    keys: Whole Building

# ------------------------------- OUTPUT:METERS ------------------------------ #
# EnergyPlus reports this meter as energy accumulated over the just-finished
# simulation interval, in joules.  The data collector converts it to kWh and
# uses kWh as the only HVAC-energy feature/target for LoRA training.
meters:
  Electricity:HVAC: HVAC_electricity_energy_j
  # Audit-only end-use meters. The world model still uses the combined HVAC
  # meter above as its energy input and target.
  Heating:Electricity: heating_electricity_energy_j
  Cooling:Electricity: cooling_electricity_energy_j

# ---------------------------------------------------------------------------- #
#                               ACTION VARIABLES                               #
# ---------------------------------------------------------------------------- #

# --------------------------- ACTUATORS TO CONTROL --------------------------- #
actuators:
  East Heating Setpoints:
    variable_name: Heating_Setpoint_RL_east
    element_type: Schedule:Compact
    value_type: Schedule Value
  East Cooling Setpoints:
    variable_name: Cooling_Setpoint_RL_east
    element_type: Schedule:Compact
    value_type: Schedule Value
  West Heating Setpoints:
    variable_name: Heating_Setpoint_RL_west
    element_type: Schedule:Compact
    value_type: Schedule Value
  West Cooling Setpoints:
    variable_name: Cooling_Setpoint_RL_west
    element_type: Schedule:Compact
    value_type: Schedule Value

# ---------------------------------------------------------------------------- #
#                   DYNAMIC CONTEXT CONFIGURABLE IN REAL-TIME                  #
# ---------------------------------------------------------------------------- #
context: {}

# ---------------------------------------------------------------------------- #
#                                 ACTIONS SPACE                                #
# ---------------------------------------------------------------------------- #
action_space: gym.spaces.Box(low=np.array([15.0, 22.0, 15.0, 22.0], dtype=np.float32), high=np.array([22.0, 30.0, 22.0, 30.0], dtype=np.float32), shape=(4,), dtype=np.float32)

# Action order: [East heating, East cooling, West heating, West cooling].
# Separate bounds preserve a valid thermostat deadband: heating <= cooling.

# ---------------------------------------------------------------------------- #
#                                REWARD FUNCTION                               #
# ---------------------------------------------------------------------------- #
reward: sinergym.utils.rewards:TwoZoneDataCenterReward

reward_kwargs:
  temperature_variables:
    - east_zone_air_temperature
    - west_zone_air_temperature
  energy_variables:
    - HVAC_electricity_demand_rate
  range_comfort_winter:
    - 20
    - 26
  range_comfort_summer:
    - 20
    - 26
  summer_start:
    - 6
    - 1
  summer_final:
    - 9
    - 30
  omega: 0.5
  alpha: 1.0
  beta: 5.0e-3
  energy_max: 50000.0
  temperature_violation_max: 6.0
