# ---------------------------------------------------------------------------- #
#                        SINERGYM ENVIRONMENT CONFIG FILE                      #
# ---------------------------------------------------------------------------- #
# Documentation: https://ugr-sail.github.io/sinergym/compilation/main/pages/environments_registration.html

# ---------------------------------------------------------------------------- #
#                       ID BASE FOR ENVIRONMENT NAMES                          #
# ---------------------------------------------------------------------------- #
id_base: 5zone-zonal

# ---------------------------------------------------------------------------- #
#                        BUILDING AND WEATHER SETTINGS                         #
# ---------------------------------------------------------------------------- #
building_file: 5ZoneAutoDXVAVnw.epJSON
# Occupancy schedules are now loaded from Schedule:File entries in the building epJSON
# using 15-minute CSVs in /workspace/examples/occupancy_schedules_15min.
# Zone mapping used:
# - SPACE5-1 <- combined_Room1 (max 38)
# - SPACE1-1 <- combined_Room2 (max 22)
# - SPACE3-1 <- combined_Room4 (max 18)
# - SPACE2-1 <- combined_Room5 (max 16)
# - SPACE4-1 <- combined_Room3 (max 13)

# Weather keys map 1:1 to registered env IDs, e.g.:
#   Eplus-5zone-zonal-chicago-continuous-v1
#   Eplus-5zone-zonal-arizona-discrete-stochastic-v1
weather_specification:
  weather_files:
    - USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw
    - USA_AZ_Davis-Monthan.AFB.722745_TMY3.epw
    - USA_NY_New.York-J.F.Kennedy.Intl.AP.744860_TMY3.epw
    - USA_WA_Port.Angeles-William.R.Fairchild.Intl.AP.727885_TMY3.epw
  keys:
    - chicago
    - arizona
    - mixed
    - cool

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
building_config: null  # Configure at runtime via gym.make(..., building_config={...})

# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #

# Alternative stochastic environments if it is defined
weather_variability:
  Dry Bulb Temperature:
    - 1.0 # sigma
    - 0.0 # mu
    - 24.0 # tau
  Relative Humidity:
    - [2.0, 5.0]
    - 0.0
    - 24.0
    - [0, 100] # var_range

# weather_variability:
#   Dry Bulb Temperature:
#     - 8.0
#     - 6
#     - 72.0
#   Relative Humidity:
#     - 18.0
#     - 5.0
#     - 24.0
#     - [0, 100]
#   Wind Speed:
#     - 5.0
#     - 2.0
#     - 24.0
#     - [0, 40]





# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #
time_variables:
  - month
  - day_of_month
  - hour

# Python-derived observations (not EnergyPlus Output:Variable names).
# ISO 7730-2005: tr=tdb, rh=40%, vr=0.15 m/s, met=1.1;
# clo=0.5 in June--September and 1.0 otherwise. Numeric at all steps;
# consumers apply occupancy masking for comfort metrics and prompt/history text.
custom_pmv:
  new_pmv_space1: air_temperature_space1
  new_pmv_space2: air_temperature_space2
  new_pmv_space3: air_temperature_space3
  new_pmv_space4: air_temperature_space4
  new_pmv_space5: air_temperature_space5

